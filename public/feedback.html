<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Feedback | Salesman Services</title><link rel="stylesheet" href="/assets/checkout.css"></head><body><main class="checkout-shell"><section class="checkout-card"><a href="/" class="back-link">← Salesman Services</a><span class="eyebrow">Verified customer feedback</span><h1>Share your experience</h1><p class="muted">Leave honest feedback here, on Discord, or on Sythe. Once reviewed, you receive 5% off your next order.</p><form id="feedbackForm"><label>Order ID<input id="orderId" required placeholder="SS-..."></label><label>Email used for the order<input id="email" type="email" required></label><label>Name or Discord name<input id="name"></label><label>Rating<select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></label><label>Your feedback<textarea id="message" required rows="6"></textarea></label><button class="primary" type="submit">Submit feedback</button><p id="result" class="muted"></p></form><div class="support-links"><a href="https://discord.gg/xDSvKT3ThQ">Discord feedback</a><a href="https://www.sythe.org/threads/ustunel66-vouches/">Sythe vouch thread</a></div></section></main><script>const params=new URLSearchParams(location.search);document.querySelector('#orderId').value=params.get('order')||'';document.querySelector('#feedbackForm').onsubmit=async(e)=>{e.preventDefault();const result=document.querySelector('#result');result.textContent='Submitting…';const r=await fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:document.querySelector('#orderId').value,email:document.querySelector('#email').value,name:document.querySelector('#name').value,rating:Number(document.querySelector('#rating').value),message:document.querySelector('#message').value})});const p=await r.json();result.textContent=p.message||p.error||'Done';if(r.ok)e.target.reset();};</script></body></html>
